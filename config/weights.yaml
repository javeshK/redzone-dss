# RedZone DSS — MCA weights and thresholds (PS 26191)
# Do not modify without documenting the change.

model_version: "1.0.0"
weights_version: "1.0.0"
pipeline_version: "2.0.0"
ml_enabled: false

crs:
  display: "EPSG:4326"
  compute: "EPSG:32644"

hazard:
  landslide:
  # H_ls = 0.45*S + 0.40*L + 0.15*R
    slope: 0.45
    landslide_density: 0.40
    rainfall: 0.15
  flash_flood:
  # H_ff = 0.50*W + 0.50*R
    wetness_stream: 0.50
    rainfall: 0.50
  # H = 1 - (1-H_ls)*(1-H_ff)

red_zone_classes:
  red: 0.70
  orange: 0.50
  yellow: 0.30
  # green: < 0.30

vulnerability:
  # V = weighted sum; renormalize if factors missing
  population: 0.25
  dependents: 0.15
  isolation: 0.20
  health_access: 0.15
  historical_exposure: 0.25

priority:
  # P = 0.60*H_hab + 0.40*V
  hazard: 0.60
  vulnerability: 0.40
  classes:
    immediate: 0.75
    short_term: 0.60
    medium_term: 0.40
  # monitor: < 0.40
  force_immediate:
    pct_red_min: 40.0
    h_hab_min: 0.80

site_screening:
  max_mean_hazard: 0.40
  max_mean_slope_deg: 20.0
  min_residual_area_ha: 3.0

capacity:
  # First-order physical screening capacity
  ha_per_person: 80
  slope_threshold_deg: 15

recommendation:
  # U_ij weights
  safety: 0.30
  distance: 0.15
  road: 0.15
  healthcare: 0.10
  school: 0.05
  water: 0.10
  capacity_fit: 0.15
  min_capacity_ratio: 0.5
